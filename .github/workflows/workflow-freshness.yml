name: Scheduled collection freshness monitor

on:
  schedule:
    # 在采集后的第 5 分钟检查；只读 GitHub 运行元数据，不触发采集。
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout locked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.14.1
      - name: Summarize scheduled collector freshness without decrypting product data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: cloud-collect.yml
        run: node 采集程序/scripts/workflow-freshness-summary.mjs
      - name: Upload freshness summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: workflow-freshness-${{ github.run_id }}
          path: 临时文件/workflow-health/workflow-freshness-summary.json
          if-no-files-found: error
          retention-days: 30
