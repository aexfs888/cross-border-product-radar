name: Weekly rules and scoring backtest

on:
  schedule:
    - cron: '47 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout locked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify types and separation rules
        run: npm run typecheck && npm test
