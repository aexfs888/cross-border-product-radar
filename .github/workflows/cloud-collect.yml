name: Free encrypted product signal collection

on:
  schedule:
    # 与本机 Hermes 同步节奏一致：每小时第 17、47 分钟（UTC）。
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encrypted-product-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      RADAR_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RADAR_SIGNING_PRIVATE_KEY_B64 }}
      RADAR_CLOUD_SOURCE_HEALTH_FILE: ${{ github.workspace }}/临时文件/cloud-state/source-health.json
    steps:
      - name: Checkout locked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Install parser-only Scrapling fallback
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Scrapling parser dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r 采集程序/scripts/requirements-scrapling-parser.txt
      - name: Verify collector types and separation rules
        run: npm run typecheck && npm test
      - name: Install checksum-locked age 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-bin"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/age.tar.gz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "BDC69C09CBDD6CF8B1F333D372A1F58247B3A33146406333E30C0F26E8F51377  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
      - name: Refuse missing encryption or signing public configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGE_RECIPIENT"
          test -n "$RADAR_SIGNING_PRIVATE_KEY_B64"
      - name: Restore public source circuit state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RADAR_CLOUD_SOURCE_HEALTH_FILE")"
          if ! curl --fail --silent --show-error --location --retry 2 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/encrypted-radar-packages/source-health.json" \
            --output "$RADAR_CLOUD_SOURCE_HEALTH_FILE"; then
            printf '%s\n' '{"schemaVersion":1,"generatedAt":"1970-01-01T00:00:00.000Z","sources":{}}' > "$RADAR_CLOUD_SOURCE_HEALTH_FILE"
          fi
      - name: Collect only approved public sources and encrypt immediately
        run: npm run collect:cloud
      - name: Produce redacted source-health summary
        run: npm run health
      - name: Prove no plaintext result remains
        shell: bash
        run: |
          set -euo pipefail
          if find 临时文件/cloud-output -type f -name '*.jsonl' -print -quit | grep -q .; then
            echo 'Plaintext collection output detected; refusing upload.' >&2
            exit 1
          fi
          test "$(find 临时文件/cloud-output -type f -name '*.age' | wc -l)" -ge 1
          test "$(find 临时文件/cloud-output -type f -name '*.manifest.json.sig' | wc -l)" -ge 1
      - name: Upload encrypted package only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: encrypted-radar-${{ github.run_id }}
          path: |
            临时文件/cloud-output/*.age
            临时文件/cloud-output/*.manifest.json
            临时文件/cloud-output/*.manifest.json.sig
            临时文件/cloud-output/source-health-summary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish encrypted package to the public no-login mirror
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/encrypted-radar-mirror"
          previous_tip=""
          if git ls-remote --exit-code --heads origin encrypted-radar-packages >/dev/null 2>&1; then
            previous_tip="$(git ls-remote --heads origin encrypted-radar-packages | cut -f1)"
            git fetch --depth=1 origin encrypted-radar-packages
            git worktree add --detach "$mirror" FETCH_HEAD
            git -C "$mirror" switch -c encrypted-radar-packages
          else
            git worktree add --detach "$mirror"
            git -C "$mirror" switch --orphan encrypted-radar-packages
            git -C "$mirror" rm -rf . --ignore-unmatch
            printf '%s\n' '*' '!.gitignore' '!index.json' '!source-health.json' '!packages/' '!packages/*/' '!packages/*/*.age' '!packages/*/*.manifest.json' '!packages/*/*.manifest.json.sig' > "$mirror/.gitignore"
          fi
          printf '%s\n' '*' '!.gitignore' '!index.json' '!source-health.json' '!packages/' '!packages/*/' '!packages/*/*.age' '!packages/*/*.manifest.json' '!packages/*/*.manifest.json.sig' > "$mirror/.gitignore"
          RADAR_PUBLISH_ROOT="$mirror" node "$GITHUB_WORKSPACE/采集程序/scripts/publish-encrypted-mirror.mjs"
          git -C "$mirror" config user.name "cross-border-product-radar[bot]"
          git -C "$mirror" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$mirror" add --all
          if ! git -C "$mirror" diff --cached --quiet; then
            # The mirror is a 14-day transport snapshot, not a permanent backup.
            # Create a parentless commit so encrypted binary history cannot grow forever.
            tree="$(git -C "$mirror" write-tree)"
            snapshot="$(printf 'Publish encrypted package %s\n' "$GITHUB_RUN_ID" | git -C "$mirror" commit-tree "$tree")"
            if [ -n "$previous_tip" ]; then
              git -C "$mirror" push --force-with-lease="refs/heads/encrypted-radar-packages:$previous_tip" origin "$snapshot:refs/heads/encrypted-radar-packages"
            else
              git -C "$mirror" push origin "$snapshot:refs/heads/encrypted-radar-packages"
            fi
          fi
