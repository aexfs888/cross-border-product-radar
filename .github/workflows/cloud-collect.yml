name: Free encrypted product signal collection

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-product-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      RADAR_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RADAR_SIGNING_PRIVATE_KEY_B64 }}
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Install checksum-locked age 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-bin"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/age.tar.gz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "BDC69C09CBDD6CF8B1F333D372A1F58247B3A33146406333E30C0F26E8F51377  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
      - name: Refuse missing encryption or signing public configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGE_RECIPIENT"
          test -n "$RADAR_SIGNING_PRIVATE_KEY_B64"
      - name: Collect only approved public sources and encrypt immediately
        run: npm run collect:cloud
      - name: Prove no plaintext result remains
        shell: bash
        run: |
          set -euo pipefail
          if find 临时文件/cloud-output -type f -name '*.jsonl' -print -quit | grep -q .; then
            echo 'Plaintext collection output detected; refusing upload.' >&2
            exit 1
          fi
          test "$(find 临时文件/cloud-output -type f -name '*.age' | wc -l)" -ge 1
          test "$(find 临时文件/cloud-output -type f -name '*.manifest.json.sig' | wc -l)" -ge 1
      - name: Upload encrypted package only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-radar-${{ github.run_id }}
          path: |
            临时文件/cloud-output/*.age
            临时文件/cloud-output/*.manifest.json
            临时文件/cloud-output/*.manifest.json.sig
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

