name: Daily cloud collection health summary

on:
  schedule:
    - cron: '37 20 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Summarize package health without decrypting product data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPOSITORY: ${{ github.repository }}
        run: node 采集程序/scripts/cloud-health-summary.mjs
      - name: Upload daily health summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-health-${{ github.run_id }}
          path: 临时文件/cloud-health/cloud-health-summary.json
          if-no-files-found: error
          retention-days: 30

