name: Daily cloud collection health summary

on:
  schedule:
    - cron: '37 20 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout locked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.14.1
      - name: Summarize package health without decrypting product data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPOSITORY: ${{ github.repository }}
        run: node 采集程序/scripts/cloud-health-summary.mjs
      - name: Upload daily health summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: cloud-health-${{ github.run_id }}
          path: 临时文件/cloud-health/cloud-health-summary.json
          if-no-files-found: error
          retention-days: 30
